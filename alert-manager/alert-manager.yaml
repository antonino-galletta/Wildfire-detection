apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-manager
  namespace: wildfire-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-manager
  template:
    metadata:
      labels:
        app: alert-manager
    spec:
      nodeSelector:
        kubernetes.io/hostname: cluster-drone1
      containers:
        - name: alert-manager
          image: agalletta/wildfire-alert-manager:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8005
          env:
            - name: ALERT_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ALERT_TTL_H
              value: "24"
            - name: MAP_CENTER_LAT
              value: "38.1137"
            - name: MAP_CENTER_LON
              value: "15.3315"
            - name: MAP_ZOOM
              value: "10"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 5
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: alert-manager
  namespace: wildfire-edge
spec:
  selector:
    app: alert-manager
  type: NodePort
  ports:
    - port: 8005
      targetPort: 8005
      nodePort: 30005
